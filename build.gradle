plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.t3ddz.obtanium'
version = '1.1'
base {
    archivesName = 'obtanium'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.262'

    mods {
        obtanium {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
}

dependencies {
    implementation files(
        'deps/allthemodium-3.2.1_mc_1.21.1.jar',
        'deps/alltheores-3.2.0_neoforge_1.21.1.jar',
        'deps/geckolib-neoforge-1.21.1-4.9.3.jar',
        'deps/lootr-neoforge-1.21.1-1.11.38.127.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}
